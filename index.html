<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Panel de Control - Inventario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ===== RESET Y BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 250px;
            background: #1a3c5e;
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        .sidebar .logo {
            text-align: center;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar .logo i {
            margin-right: 10px;
        }
        .sidebar nav {
            flex: 1;
            padding: 20px 0;
        }
        .sidebar nav a {
            display: flex;
            align-items: center;
            padding: 12px 25px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            cursor: pointer;
        }
        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: rgba(255,255,255,0.1);
            color: white;
            border-left-color: #4fc3f7;
        }
        .sidebar nav a i {
            width: 25px;
            margin-right: 10px;
            text-align: center;
        }
        .sidebar .user-info {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
        }
        .sidebar .user-info .name {
            font-weight: bold;
        }
        .sidebar .user-info .role {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
        }
        .sidebar .user-info .logout {
            color: #ff6b6b;
            cursor: pointer;
            margin-top: 8px;
            display: inline-block;
        }
        .sidebar .user-info .logout:hover {
            text-decoration: underline;
        }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 101;
            background: #1a3c5e;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
        }

        .main-content {
            margin-left: 250px;
            flex: 1;
            padding: 20px;
            transition: margin-left 0.3s ease;
        }
        .main-content .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }
        .main-content .header h1 {
            font-size: 28px;
            color: #1a3c5e;
        }
        .main-content .header .date {
            color: #666;
            font-size: 14px;
        }

        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .card .card-title {
            color: #888;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card .card-value {
            font-size: 28px;
            font-weight: bold;
            color: #1a3c5e;
            margin: 8px 0;
        }
        .card .card-icon {
            font-size: 24px;
            color: #4fc3f7;
            float: right;
        }
        .card .card-change {
            font-size: 13px;
            color: #28a745;
        }
        .card .card-change.negative {
            color: #dc3545;
        }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .chart-container h3 {
            color: #1a3c5e;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .chart-container canvas {
            max-height: 200px;
            max-width: 100%;
        }

        .alertas-stock {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: none;
        }
        .alertas-stock.show {
            display: block;
        }
        .alertas-stock h4 {
            color: #856404;
            margin-bottom: 8px;
        }
        .alertas-stock .alerta-item {
            display: inline-block;
            background: #ffeeba;
            padding: 4px 12px;
            border-radius: 12px;
            margin: 3px 5px 3px 0;
            font-size: 13px;
            color: #856404;
        }

        .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }
        .filtros input,
        .filtros select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            flex: 1 1 150px;
            min-width: 120px;
        }
        .filtros input:focus,
        .filtros select:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        .filtros .btn {
            flex: 0 0 auto;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .table-container .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-container .table-header h2 {
            font-size: 18px;
            color: #1a3c5e;
        }
        .table-container .table-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 600px;
        }
        th {
            background: #f8f9fa;
            text-align: left;
            padding: 10px 12px;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #dee2e6;
            white-space: nowrap;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #e9ecef;
            word-break: break-word;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-disponible {
            background: #d4edda;
            color: #155724;
        }
        .badge-vendido {
            background: #f8d7da;
            color: #721c24;
        }
        .badge-retirado {
            background: #e2e3e5;
            color: #383d41;
        }
        .badge-reservado {
            background: #fff3cd;
            color: #856404;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-primary {
            background: #1a3c5e;
            color: white;
        }
        .btn-primary:hover {
            background: #2a5c7e;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .btn-warning {
            background: #ffc107;
            color: #333;
        }
        .btn-warning:hover {
            background: #e0a800;
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #1a3c5e;
            color: #1a3c5e;
        }
        .btn-outline:hover {
            background: #1a3c5e;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            margin: 20px;
        }
        .modal-content h2 {
            margin-bottom: 20px;
            color: #1a3c5e;
        }
        .modal-content .form-group {
            margin-bottom: 15px;
        }
        .modal-content .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .modal-content .form-group input,
        .modal-content .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .modal-content .form-group input:focus,
        .modal-content .form-group select:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        .modal-content .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .loading i {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .acciones-venta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .acciones-venta .btn-sm {
            width: 100%;
            justify-content: center;
        }

        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 99;
        }
        .sidebar-overlay.show {
            display: block;
        }

        @media (max-width: 992px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
            .dashboard-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 15px;
                padding-top: 60px;
            }
            .dashboard-cards {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .card .card-value {
                font-size: 22px;
            }
            .main-content .header h1 {
                font-size: 22px;
            }
            .filtros input,
            .filtros select {
                flex: 1 1 100%;
                min-width: 100%;
            }
            .filtros .btn {
                flex: 1 1 45%;
            }
            table {
                font-size: 12px;
                min-width: 500px;
            }
            th, td {
                padding: 6px 8px;
            }
            .modal-content {
                padding: 20px;
                margin: 10px;
            }
            .table-container {
                padding: 12px;
            }
            .btn {
                font-size: 12px;
                padding: 6px 12px;
            }
        }

        @media (max-width: 480px) {
            .dashboard-cards {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .card {
                padding: 12px;
            }
            .card .card-value {
                font-size: 18px;
            }
            .card .card-title {
                font-size: 11px;
            }
            .main-content .header h1 {
                font-size: 18px;
            }
            .table-container .table-header h2 {
                font-size: 15px;
            }
            .btn-sm {
                font-size: 10px;
                padding: 3px 6px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== OVERLAY PARA MÓVIL ===== -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- ===== BOTÓN HAMBURGUESA ===== -->
    <button class="menu-toggle" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <i class="fas fa-phone"></i>
            <span>Inventario</span>
        </div>
        <nav>
            <a href="#" class="active" data-page="dashboard">
                <i class="fas fa-chart-pie"></i><span>Dashboard</span>
            </a>
            <a href="#" data-page="equipos">
                <i class="fas fa-mobile-alt"></i><span>Equipos</span>
            </a>
            <a href="#" data-page="ventas">
                <i class="fas fa-shopping-cart"></i><span>Ventas</span>
            </a>
            <a href="#" data-page="usuarios">
                <i class="fas fa-users"></i><span>Usuarios</span>
            </a>
        </nav>
        <div class="user-info">
            <div class="name"><i class="fas fa-user-circle"></i> Administrador</div>
            <div class="role">Dueño</div>
            <span class="logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</span>
        </div>
    </aside>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <main class="main-content" id="mainContent">
        <div class="header">
            <h1 id="pageTitle">Dashboard</h1>
            <span class="date" id="currentDate"></span>
        </div>

        <div id="pageContent"></div>
    </main>

    <!-- ===== MODAL ===== -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <!-- ============================================ -->
    <!-- JAVASCRIPT COMPLETO                          -->
    <!-- ============================================ -->

    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================
        const API_URL = 'https://inventario-api-production-afa2.up.railway.app';
        let graficoVentas = null;
        let graficoStock = null;

        // ============================================
        // FUNCIÓN PARA FETCH CON TOKEN
        // ============================================
        async function fetchAPI(endpoint, options = {}) {
            console.log(`📡 fetchAPI: ${endpoint}`);
            
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                console.error('❌ No hay usuario en localStorage');
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(userStr);
            if (!user || !user.token) {
                console.error('❌ No hay token disponible');
                window.location.href = 'login.html';
                return;
            }

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${user.token}`
            };

            const url = endpoint.startsWith('/') ? endpoint : '/' + endpoint;
            console.log(`📤 URL completa: ${API_URL}${url}`);
            
            const response = await fetch(`${API_URL}${url}`, {
                ...options,
                headers: { ...headers, ...options.headers }
            });

            if (response.status === 401) {
                console.warn('⚠️ Token expirado o inválido');
                localStorage.removeItem('user');
                window.location.href = 'login.html';
                throw new Error('Sesión expirada');
            }

            return response;
        }

 const API_URL = 'https://inventario-api-production-afa2.up.railway.app';

        // ============================================
        // TOGGLE SIDEBAR
        // ============================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        document.querySelectorAll('.sidebar nav a').forEach(a => {
            a.addEventListener('click', function() {
                if (window.innerWidth <= 768) {
                    toggleSidebar();
                }
            });
        });

        // ============================================
        // VERIFICACIÓN DE SESIÓN
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔍 Verificando sesión...');

            const userDataStr = localStorage.getItem('user');
            console.log('📦 Datos en localStorage:', userDataStr);

            if (!userDataStr) {
                console.log('❌ No hay sesión activa');
                window.location.href = 'login.html';
                return;
            }

            try {
                const userData = JSON.parse(userDataStr);
                console.log('👤 Usuario parseado:', userData);

                if (!userData.token) {
                    console.log('❌ No hay token en los datos');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                    return;
                }

                if (!userData.email) {
                    console.log('❌ No hay email en los datos');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                    return;
                }

                if (userData.rol !== 'admin') {
                    console.log('❌ No es admin, redirigiendo...');
                    localStorage.removeItem('user');
                    alert('❌ Acceso denegado. Solo administradores pueden acceder a esta página.');
                    window.location.href = 'login.html';
                    return;
                }

                console.log('✅ Sesión válida. Bienvenido admin!');

                const userNameElement = document.querySelector('.user-info .name');
                if (userNameElement) {
                    userNameElement.innerHTML =
                        `<i class="fas fa-user-circle"></i> ${userData.nombre || userData.email}`;
                }

                document.getElementById('currentDate').textContent =
                    new Date().toLocaleDateString('es-PE', { weekday: 'long', year: 'numeric', month: 'long',
                        day: 'numeric' });

                console.log('📅 Fecha actualizada');

                const initialPage = window.location.hash.replace('#', '') || 'dashboard';
                console.log(`📄 Página inicial: ${initialPage}`);
                loadPage(initialPage);

            } catch (e) {
                console.error('❌ Error al verificar sesión:', e);
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            }
        });

        // ============================================
        // NAVEGACIÓN
        // ============================================
        function loadPage(page) {
            console.log(`📄 loadPage llamada con: ${page}`);
            
            document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
            const activeLink = document.querySelector(`.sidebar nav a[data-page="${page}"]`);
            if (activeLink) {
                activeLink.classList.add('active');
            }
            console.log('✅ Sidebar actualizado');

            const titles = {
                dashboard: 'Dashboard',
                equipos: 'Gestión de Equipos',
                ventas: 'Reporte de Ventas',
                usuarios: 'Gestión de Usuarios'
            };
            document.getElementById('pageTitle').textContent = titles[page] || 'Dashboard';
            console.log(`✅ Título actualizado: ${titles[page]}`);

            const content = document.getElementById('pageContent');
            console.log(`📦 Cargando contenido para: ${page}`);
            
            if (page === 'dashboard') {
                console.log('📊 Ejecutando renderDashboard...');
                renderDashboard(content);
            } else if (page === 'equipos') {
                console.log('📱 Ejecutando renderEquipos...');
                renderEquipos(content);
            } else if (page === 'ventas') {
                console.log('💰 Ejecutando renderVentas...');
                renderVentas(content);
            } else if (page === 'usuarios') {
                console.log('👥 Ejecutando renderUsuarios...');
                renderUsuarios(content);
            }

            history.pushState({ page }, '', `#${page}`);
            console.log('✅ URL actualizada');
        }

        window.addEventListener('popstate', function(e) {
            const page = e.state?.page || 'dashboard';
            console.log(`🔙 Popstate: ${page}`);
            loadPage(page);
        });

        document.querySelectorAll('.sidebar nav a').forEach(a => {
            a.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.dataset.page;
                console.log(`🖱️ Click en sidebar: ${page}`);
                loadPage(page);
            });
        });

        // ============================================
        // FUNCIONES DE MODAL
        // ============================================
        function openModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modal').classList.add('active');
            console.log('📂 Modal abierto');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            console.log('📂 Modal cerrado');
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============================================
        // DASHBOARD
        // ============================================
        async function renderDashboard(container) {
            console.log('🔄 renderDashboard iniciado');
            
            container.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Cargando datos del dashboard...</p>
                </div>
            `;
            console.log('✅ HTML de carga mostrado');

            try {
                console.log('📡 Iniciando peticiones a la API...');
                
                const userStr = localStorage.getItem('user');
                const user = userStr ? JSON.parse(userStr) : null;
                console.log(`👤 Token presente: ${user?.token ? '✅ Sí' : '❌ No'}`);

                const [resumen, ventasHoy, stock, stockBajo] = await Promise.all([
                    fetchAPI('/api/reportes/resumen').then(r => r.json()),
                    fetchAPI('/api/reportes/ventas-hoy').then(r => r.json()),
                    fetchAPI('/api/stock').then(r => r.json()),
                    fetchAPI('/api/reportes/stock-bajo?limite=3').then(r => r.json()).catch(() => [])
                ]);

                console.log('📊 Datos recibidos:', { resumen, ventasHoy, stock, stockBajo });

                const totalStock = stock.reduce((acc, item) => acc + (item.disponibles || 0), 0);

                let alertasHtml = '';
                if (stockBajo && stockBajo.length > 0) {
                    alertasHtml = `
                        <div class="alertas-stock show">
                            <h4><i class="fas fa-exclamation-triangle"></i> ⚠️ Stock Bajo</h4>
                            ${stockBajo.map(item => `
                                <span class="alerta-item">

        function initCharts(stock, ventasHoy) {
            try {

                if (ctxStock) {
                    const marcas = {};
                    stock.forEach(item => {
                        marcas[item.marca] = (marcas[item.marca] || 0) + item.disponibles;
                    });

                    if (graficoStock) {
                        graficoStock.destroy();
                    }

                    graficoStock = new Chart(ctxStock, {
                        type: 'doughnut',
                        data: {
                            labels: Object.keys(marcas),
                            datasets: [{
                                data: Object.values(marcas),

                                borderWidth: 1
                            }]
                        },

                            responsive: true,
                            maintainAspectRatio: true,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: {
                                        font: { size: 10 }
                                    }
                                }
                            }
                        }

        // ============================================
        // EXPORTAR REPORTE EXCEL
        // ============================================
        async function descargarReporteExcel() {
            console.log('📥 Descargando reporte con filtros...');
            
            const fechaInicio = document.getElementById('filtroVentaInicio')?.value || '';
            const fechaFin = document.getElementById('filtroVentaFin')?.value || '';
            const marca = document.getElementById('filtroVentaMarca')?.value?.trim() || '';
            const modelo = document.getElementById('filtroVentaModelo')?.value?.trim() || '';

            const params = new URLSearchParams();
            if (fechaInicio) params.append('fecha_inicio', fechaInicio);
            if (fechaFin) params.append('fecha_fin', fechaFin);
            if (marca) params.append('marca', marca);
            if (modelo) params.append('modelo', modelo);

            const paramsStr = params.toString();
            console.log('📤 Parámetros de exportación:', paramsStr);

            try {
                const url = `/api/reportes/exportar/ventas${paramsStr ? '?' + paramsStr : ''}`;
                console.log('📤 URL:', url);
                
                const response = await fetchAPI(url);
                const data = await response.json();

                console.log('📥 Datos de exportación:', data);

                if (!data.success || !data.data || data.data.length === 0) {
                    alert('❌ No hay datos para exportar con los filtros seleccionados.');
                    return;
                }

                const headers = ['Fecha', 'IMEI', 'Marca', 'Modelo', 'Precio', 'Método Pago', 'Cliente', 'Vendedor'];
                const rows = data.data.map(item => [
                    item.fecha || '',
                    item.imei || '',
                    item.marca || '',
                    item.modelo || '',
                    item.precio || 0,
                    item.metodo_pago || '',
                    item.cliente || '',
                    item.vendedor || ''
                ]);

                let csv = headers.join(',') + '\n';
                rows.forEach(row => {
                    csv += row.join(',') + '\n';
                });

                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const urlDownload = URL.createObjectURL(blob);
                
                let nombreArchivo = 'reporte_ventas';
                if (fechaInicio) nombreArchivo += `_desde_${fechaInicio}`;
                if (fechaFin) nombreArchivo += `_hasta_${fechaFin}`;
                if (marca) nombreArchivo += `_${marca}`;
                nombreArchivo += `_${new Date().toISOString().split('T')[0]}.csv`;
                
                link.setAttribute('href', urlDownload);
                link.setAttribute('download', nombreArchivo);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(urlDownload);

                console.log('✅ Reporte descargado correctamente');
                alert(`✅ Reporte exportado con ${data.data.length} registros.`);
            } catch (error) {
                console.error('❌ Error al descargar reporte:', error);
                alert('❌ Error al descargar el reporte: ' + error.message);
            }
        }

        async function registrarEquipo(e) {
            e.preventDefault();
            console.log('📝 Registrando equipo...');
            
            const marcaSelect = document.getElementById('marca_id');
            const modeloSelect = document.getElementById('modelo_id');
            const nuevoModeloInput = document.getElementById('nuevo_modelo');
            
            let marcaId = parseInt(marcaSelect.value);
            let modeloId = parseInt(modeloSelect.value);
            
            // 1. Verificar si se seleccionó "Agregar Nueva Marca"
            if (marcaSelect.value === 'nuevo') {
                const nuevaMarca = document.getElementById('nueva_marca').value.trim();
                
                if (!nuevaMarca) {
                    alert('❌ Debes ingresar el nombre de la nueva marca.');
                    return;
                }
                
                console.log(`📝 Creando nueva marca: ${nuevaMarca}`);
                
                try {
                    const user = JSON.parse(localStorage.getItem('user'));
                    
                    const createMarcaResponse = await fetch(`${API_URL}/api/marcas`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${user.token}`
                        },
                        body: JSON.stringify({ nombre: nuevaMarca })
                    });
                    
                    const marcaData = await createMarcaResponse.json();
                    marcaId = marcaData.id;
                    console.log(`✅ Marca creada: ${marcaId}`);
                    
                    await cargarMarcas();
                    
                } catch (error) {
                    console.error('❌ Error al crear marca:', error);
                    alert('❌ Error al crear la nueva marca: ' + error.message);
                    return;
                }
            }
            
            // 2. Verificar si se ingresó un nuevo modelo
            const nuevoModelo = nuevoModeloInput.value.trim();
            
            if (nuevoModelo) {
                console.log(`📝 Creando nuevo modelo: ${nuevoModelo} para marca ${marcaId}`);
                
                try {
                    const user = JSON.parse(localStorage.getItem('user'));
                    
                    const createModeloResponse = await fetch(`${API_URL}/api/modelos`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${user.token}`
                        },
                        body: JSON.stringify({
                            marca_id: marcaId,
                            nombre: nuevoModelo,
                            descripcion: ''
                        })
                    });
                    
                    const modeloData = await createModeloResponse.json();
                    modeloId = modeloData.id;
                    console.log(`✅ Modelo creado: ${modeloId}`);
                    
                    await cargarModelos();
                    
                } catch (error) {
                    console.error('❌ Error al crear modelo:', error);
                    alert('❌ Error al crear el nuevo modelo: ' + error.message);
                    return;
                }
            }
            
            // 3. Validar que se haya seleccionado un modelo
            if (!modeloId || isNaN(modeloId)) {
                alert('❌ Debes seleccionar un modelo o ingresar uno nuevo.');
                return;
            }
            
            // 4. Registrar el equipo
            const data = {
                modelo_id: modeloId,
                imei: document.getElementById('imei').value,
                color: document.getElementById('color').value,
                almacenamiento: document.getElementById('almacenamiento').value,
                precio_compra: parseFloat(document.getElementById('precio_compra').value),
                precio_venta: parseFloat(document.getElementById('precio_venta').value),
                observaciones: document.getElementById('observaciones').value
            };

            try {
                const response = await fetchAPI('/api/equipos', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (response.ok) {
                    alert('✅ ' + result.message);
                    closeModal();
                    loadPage('equipos');
                } else {
                    alert('❌ ' + (result.detail || 'Error al registrar'));
                }
            } catch (error) {
                console.error('❌ Error al registrar equipo:', error);
                alert('❌ Error de conexión: ' + error.message);
            }
        }

            } catch (error) {
                console.error('❌ Error al eliminar usuario:', error);
                alert('❌ Error de conexión: ' + error.message);
            }
        }

        // ============================================
        // ACTIVAR USUARIO
        // ============================================
        async function activarUsuario(id, email) {
            console.log(`🔄 Activando usuario: ${email}`);
            
            if (!confirm(`¿Seguro que deseas activar al usuario "${email}"?`)) {
                console.log('❌ Activación cancelada');
                return;
            }

            try {
                const response = await fetchAPI(`/api/usuarios/${id}/activar`, {
                    method: 'PUT'
                });
                const result = await response.json();
                if (response.ok) {
                    alert('✅ ' + result.message);
                    loadPage('usuarios');
                } else {
                    alert('❌ ' + (result.detail || 'Error al activar'));
                }
            } catch (error) {
                console.error('❌ Error al activar usuario:', error);
                alert('❌ Error de conexión: ' + error.message);
            }
        }

        // ============================================
        // LOGOUT
        // ============================================
        function logout() {
            console.log('🚪 Cerrando sesión...');
            if (confirm('¿Seguro que deseas cerrar sesión?')) {
                localStorage.removeItem('user');
                console.log('✅ Sesión cerrada');
                window.location.href = 'login.html';
            }
        }
    </script>

</body>
</html>
